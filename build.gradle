/*
 * This file was generated by the Gradle 'init' task.
 */
plugins {
    id 'java'
    id 'maven-publish'
    id 'eclipse'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.6'   // ← added
    id 'checkstyle'
    id 'com.diffplug.spotless' version '6.19.0'
    id "org.springdoc.openapi-gradle-plugin" version "1.9.0"
    id 'net.ltgt.errorprone' version '2.0.2'               // ← fixed version
}

repositories {
    mavenCentral()
    // Mifos Platform BOM + ph-ee-connector-common 2.0.0-SNAPSHOT are consumed from
    // the local JFrog Artifactory sandbox (Docker Compose in proposal/local-jfrog/).
    // Swap this host for the production Mifos JFrog when it is ready.
    maven {
        name = 'LocalJFrog'
        url = uri('http://localhost:8081/artifactory/mifos-platform-snapshot')
        allowInsecureProtocol = true
        credentials {
            username = findProperty('localJfrog.user') ?: System.getenv('LOCAL_JFROG_USER')
            password = findProperty('localJfrog.key') ?: System.getenv('LOCAL_JFROG_KEY')
        }
    }
    maven { url 'https://mifos.jfrog.io/artifactory/phee-gradle-local' }
    maven { url 'https://mifos.jfrog.io/artifactory/mifosx-gradle-local' }
}

apply plugin: 'com.diffplug.spotless'

spotless {
    format 'misc', {
        target '**/*.md', '**/*.properties', '**/.gitignore', '**/.openapi-generator-ignore', '**/*.yml', '**/*.xml', '**/**.json', '**/*.sql'
        targetExclude '**/build/**', '**/bin/**', '**/.settings/**', '**/.idea/**', '**/.gradle/**', '**/gradlew.bat', '**/licenses/**', '**/banner.txt', '.vscode/**'
        indentWithSpaces(4)
        endWithNewline()
        trimTrailingWhitespace()
    }
    groovyGradle {
        target '*.gradle', '**/*.gradle'
        targetExclude '**/build/**'
        greclipse()
        indentWithSpaces(4)
        endWithNewline()
        trimTrailingWhitespace()
    }
    lineEndings 'UNIX'
}

dependencies {
    // Mifos Platform BOM pins Spring Boot 3.4, Camel 4, Zeebe 8, Jakarta EE 10 and
    // every other shared library version. Do NOT hardcode managed versions below.
    // This is a deployable application (leaf node), so use enforcedPlatform().
    implementation enforcedPlatform('org.mifos.platform:mifos-platform-bom:1.0.0-SNAPSHOT')

    implementation 'org.mifos:ph-ee-connector-common:2.0.0-SNAPSHOT'

    // Spring Boot – versions now come from the BOM
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Camel
    implementation 'org.apache.camel.springboot:camel-spring-boot-starter'
    implementation 'org.apache.camel:camel-jackson'
    implementation 'org.apache.camel:camel-http'
    implementation 'org.apache.camel:camel-rest'
    implementation 'org.apache.camel:camel-jsonpath'
    implementation 'org.apache.camel:camel-bean'
    implementation 'org.apache.camel:camel-log'

    implementation 'io.camunda:zeebe-client-java'

    implementation 'com.google.code.gson:gson'
    implementation 'org.json:json'
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.600'
    implementation 'com.azure:azure-storage-blob'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    implementation 'io.rest-assured:rest-assured'
    implementation 'io.rest-assured:json-path'
    implementation 'io.rest-assured:xml-path'
    implementation 'io.rest-assured:spring-mock-mvc'
    implementation 'io.rest-assured:json-schema-validator'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    checkstyle 'com.puppycrawl.tools:checkstyle:10.9.3'
    checkstyle 'com.github.sevntu-checkstyle:sevntu-checks:1.44.1'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.apache.camel:camel-test-spring-junit5"
    testImplementation 'io.cucumber:cucumber-java:7.15.0'
    testImplementation 'io.cucumber:cucumber-spring:7.15.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.15.0'
    testImplementation 'com.google.truth:truth:1.1.3'

    // ErrorProne core (required by the plugin)
    errorprone 'com.google.errorprone:error_prone_core:2.20.0'
}

configure(this) {
    // NOTE: order matters!
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'eclipse'
    apply plugin: 'checkstyle'
    apply plugin: 'net.ltgt.errorprone'

    configurations {
        implementation.setCanBeResolved(true)
        api.setCanBeResolved(true)
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs += [
            "-Xlint:unchecked",
            "-Xlint:cast",
            "-Xlint:auxiliaryclass",
            "-Xlint:deprecation",
            "-Xlint:dep-ann",
            "-Xlint:divzero",
            "-Xlint:empty",
            "-Xlint:exports",
            "-Xlint:fallthrough",
            "-Xlint:finally",
            "-Xlint:module",
            "-Xlint:opens",
            "-Xlint:options",
            "-Xlint:overloads",
            "-Xlint:overrides",
            "-Xlint:path",
            "-Xlint:processing",
            "-Xlint:removal",
            "-Xlint:requires-automatic",
            "-Xlint:requires-transitive-automatic",
            "-Xlint:try",
            "-Xlint:varargs",
            "-Xlint:preview",
            "-Xlint:static",
            "-Xmaxwarns",
            1500,
            "-Xmaxerrs",
            1500
        ]
        options.deprecation = true
        options.encoding = 'UTF-8'
    }

    spotless {
        java {
            targetExclude '**/build/**', '**/bin/**', '**/out/**'
            importOrder()
            removeUnusedImports()
            eclipse().configFile "$rootDir/config/mock-formatter.xml"
            endWithNewline()
            trimTrailingWhitespace()
            custom 'Modifier ordering', {
                def modifierRanking = [
                    public : 1, protected : 2, private : 3, abstract : 4, default : 5,
                    static : 6, final : 7, transient : 8, volatile : 9,
                    synchronized: 10, native : 11, strictfp : 12
                ]
                it.replaceAll(/\W(?:public |protected |private |abstract |default |static |final |transient |volatile |synchronized |native |strictfp ){2,}/, {
                    it.replaceAll(/(?:public |protected |private |abstract |default |static |final |transient |volatile |synchronized |native |strictfp ){2,}/, {
                        it.split().sort({ modifierRanking[it] }).join(' ') + ' '
                    })
                })
            }
        }
        lineEndings 'UNIX'
    }

    if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
        sourceSets.main.java.outputDir = file("$projectDir/bin/main")
    }

    dependencies {
        checkstyle 'com.puppycrawl.tools:checkstyle:10.3.1'
        checkstyle 'com.github.sevntu-checkstyle:sevntu-checks:1.42.0'
    }

    tasks.withType(JavaCompile) {
        options.errorprone {
            enabled = project.gradle.startParameter.taskNames.contains('build') || project.gradle.startParameter.taskNames.contains('check')
            disableWarningsInGeneratedCode = true
            excludedPaths = ".*/build/.*"
            disable(
                    "UnusedVariable", "TypeParameterUnusedInFormals", "EmptyBlockTag", "MissingSummary",
                    "InvalidParam", "ReturnFromVoid", "AlmostJavadoc", "InvalidBlockTag", "JavaUtilDate",
                    "ReturnValueIgnored", "DirectInvocationOnMock", "CanIgnoreReturnValueSuggester",
                    "SameNameButDifferent", "MultiVariableDeclaration", "UnnecessaryDefaultInEnumSwitch"
                    )
            error(
                    "DefaultCharset", "RemoveUnusedImports", "WaitNotInLoop", "ThreeLetterTimeZoneID",
                    "VariableNameSameAsType", "UnnecessaryParentheses", "MultipleTopLevelClasses",
                    "MixedMutabilityReturnType", "AssertEqualsArgumentOrderChecker", "EmptySetMultibindingContributions",
                    "BigDecimalEquals", "MixedArrayDimensions", "UseBinds", "BadImport", "IntLongMath",
                    "FloatCast", "ReachabilityFenceUsage", "StreamResourceLeak", "TruthIncompatibleType",
                    "ByteBufferBackingArray", "OrphanedFormatString", "CatchAndPrintStackTrace",
                    "ObjectToString", "StringSplitter", "AssertThrowsMultipleStatements", "BoxedPrimitiveConstructor",
                    "EmptyCatch", "BoxedPrimitiveEquality", "SynchronizeOnNonFinalField", "WildcardImport",
                    "PrivateConstructorForNoninstantiableModule", "ClassCanBeStatic", "ClassNewInstance",
                    "UnnecessaryStaticImport", "UnsafeFinalization", "JavaTimeDefaultTimeZone", "JodaPlusMinusLong",
                    "SwitchDefault", "VarTypeName", "ArgumentSelectionDefectChecker", "CompareToZero",
                    "InjectOnConstructorOfAbstractClass", "ImmutableEnumChecker", "NarrowingCompoundAssignment",
                    "MissingCasesInEnumSwitch", "ReferenceEquality", "UndefinedEquals", "UnescapedEntity",
                    "ModifyCollectionInEnhancedForLoop", "NonCanonicalType", "InvalidInlineTag",
                    "MutablePublicArray", "StaticAssignmentInConstructor", "ProtectedMembersInFinalClass",
                    "OperatorPrecedence", "EqualsGetClass", "EqualsUnsafeCast", "DoubleBraceInitialization",
                    "UnusedNestedClass", "UnusedMethod", "ModifiedButNotUsed", "InconsistentCapitalization",
                    "MissingOverride"
                    )
        }
    }
}

group = 'org.mifos'
version = '2.0.0.mifos-SNAPSHOT'
description = 'ph-ee-connector-mock-payment-schema'
sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

configurations {
    cucumberRuntime {
        extendsFrom testImplementation
    }
}

task cucumberCli() {
    dependsOn assemble, testClasses
    doLast {
        javaexec {
            main = "io.cucumber.core.cli.Main"
            classpath = configurations.cucumberRuntime + sourceSets.main.output + sourceSets.test.output
            args = [
                '--plugin',
                'pretty',
                '--plugin',
                'html:target/cucumber-report.html',
                '--glue',
                'org.mifos.processor.cucumber',
                'src/test/java/resources'
            ]
        }
    }
}

openApi {
    apiDocsUrl.set("http://localhost:8080/v3/api-docs")
    outputDir.set(file("src/main/java/docs"))
    outputFileName.set("swagger.yaml")
}

tasks.named('bootJar') {
    enabled = true
    archiveFileName = "mock-payment-schema-${version}.jar"
}

tasks.named('jar') {
    enabled = false
}
